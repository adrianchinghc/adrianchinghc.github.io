name: Publish AdrianChing.com

on:
  push:
    branches:
      - source
  workflow_dispatch:
  schedule:
    # UTC, twice hourly away from the busy top of the hour.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  publication-check:
    name: Check for scheduled articles
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.due.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source
      - name: Pin the release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name == 'schedule'
      - name: Check publication dates against the live sitemap
        id: due
        if: github.event_name == 'schedule'
        run: node scripts/check-scheduled-publication.mjs

  build:
    name: Build and check
    needs: publication-check
    if: github.ref == 'refs/heads/source' && (github.event_name != 'schedule' || needs.publication-check.outputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public measurement ID; production only. Vercel previews do not inherit it.
      GA_MEASUREMENT_ID: G-Z7QMLP7BSE
      META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
      HOTJAR_ID: ${{ secrets.HOTJAR_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publication-check.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check generated site
        run: npm run check

      - name: Check navigation, images and cache clearing
        run: node --test scripts/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: [publication-check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publication-check.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release artifact for cache URL manifest
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact

      - name: Prepare current and previous cache URL manifests
        run: |
          mkdir -p _site
          tar -xf pages-artifact/artifact.tar -C _site
          curl --fail --silent --show-error --retry 3 --max-time 30 "https://adrianching.com/sitemap.xml?release=${GITHUB_SHA}" -o previous-sitemap.xml

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check cache clearing configuration
        id: cache_config
        env:
          PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          if [ -n "$PURGE_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Automatic HTML cache clearing is inactive. Add CLOUDFLARE_CACHE_PURGE_TOKEN; cached HTML expires using the origin TTL until configured."
          fi

      - name: Clear published HTML from Cloudflare
        if: steps.cache_config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ZONE_ID: fa2b373c43bcc6f4112bdc7feacd051a
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: node scripts/purge-cloudflare.mjs
