name: Lighthouse
on:
  workflow_dispatch:
  pull_request:
    branches: [source]
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Local production-mode output: preview noindex is deliberately preserved on Vercel.
      - run: npm run build && npm run check
      - name: Audit representative pages on mobile and desktop
        run: |
          mobile_status=0
          desktop_status=0
          LHCI_DEVICE=mobile npx --yes @lhci/cli@0.15.1 autorun || mobile_status=$?
          LHCI_DEVICE=desktop npx --yes @lhci/cli@0.15.1 autorun || desktop_status=$?
          if (( mobile_status != 0 || desktop_status != 0 )); then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          retention-days: 3
          path: |
            lighthouse-reports
            .lighthouseci
