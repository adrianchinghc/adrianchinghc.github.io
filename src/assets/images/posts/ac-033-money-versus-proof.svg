le cx="112" cy="1192" r="30" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="112" y="1202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#22231f" text-anchor="middle">2</text><text x="172" y="1186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#22231f" text-anchor="start">Buy a CRM add-on</text><text x="172" y="1222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#5e6259" text-anchor="start">Money 4 · Proof 3</text><circle cx="112" cy="1282" r="30" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="112" y="1292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#22231f" text-anchor="middle">3</text><text x="172" y="1276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#22231f" text-anchor="start">Automate with AI</text><text x="172" y="1312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#5e6259" text-anchor="start">Money 5 · Proof 3</text><circle cx="112" cy="1372" r="30" fill="#a53b29" stroke="#a53b29" stroke-width="3"/><text x="112" y="1382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="172" y="1366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#22231f" text-anchor="start">Build custom</text><text x="172" y="1402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#5e6259" text-anchor="start">Money 5 · Proof 2</text><circle cx="112" cy="1462" r="30" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="112" y="1472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#22231f" text-anchor="middle">5</text><text x="172" y="1456" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#22231f" text-anchor="start">Do nothing</text><text x="172" y="1492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="400" fill="#5e6259" text-anchor="start">Money 0 · Proof 5</text>
