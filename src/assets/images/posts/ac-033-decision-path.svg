<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1634" width="1200" height="1634" role="img" aria-label="Eight steps from finding the leak to approving spend">
<rect width="1200" height="1634" fill="#fafaf7"/>
<rect x="80" y="50" width="1040" height="108" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="104" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">1</text><text x="216" y="113.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Ask where the business loses money</text><path d="M600 148V214" stroke="#d8dad1" stroke-width="3"/><path d="M592 204L600 214L608 204" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="204" width="1040" height="108" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="258" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">2</text><text x="216" y="267.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Pull the real numbers</text><path d="M600 302V368" stroke="#d8dad1" stroke-width="3"/><path d="M592 358L600 368L608 358" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="358" width="1040" height="150" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="433" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">3</text><text x="216" y="415.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Sort them: facts, fair guesses,</text><text x="216" y="469.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">unknowns</text><path d="M600 498V564" stroke="#d8dad1" stroke-width="3"/><path d="M592 554L600 564L608 554" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="554" width="1040" height="108" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="608" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="618" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">4</text><text x="216" y="617.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Write down all five options</text><path d="M600 652V718" stroke="#d8dad1" stroke-width="3"/><path d="M592 708L600 718L608 708" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="708" width="1040" height="150" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="783" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="793" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">5</text><text x="216" y="765.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Score every option, money against</text><text x="216" y="819.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">proof</text><path d="M600 848V914" stroke="#d8dad1" stroke-width="3"/><path d="M592 904L600 914L608 904" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="904" width="1040" height="108" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="958" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="968" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">6</text><text x="216" y="967.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Choose, and write down why</text><rect x="80" y="1042" width="1040" height="150" rx="14" fill="none" stroke="#a53b29" stroke-width="3" stroke-dasharray="10 8"/><text x="112" y="1110.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#a53b29" text-anchor="start">Nothing clears the bar?</text><text x="112" y="1164.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="400" fill="#a53b29" text-anchor="start">Stop. Say so out loud.</text><path d="M600 1002V1052" stroke="#d8dad1" stroke-width="3"/><path d="M592 1042L600 1052L608 1042" fill="none" stroke="#d8dad1" stroke-width="3"/><path d="M600 1182V1248" stroke="#d8dad1" stroke-width="3"/><path d="M592 1238L600 1248L608 1238" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="1238" width="1040" height="150" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="1313" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="1323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">7</text><text x="216" y="1295.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Run one 90-day test with a stop</text><text x="216" y="1349.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">rule</text><path d="M600 1378V1444" stroke="#d8dad1" stroke-width="3"/><path d="M592 1434L600 1444L608 1434" fill="none" stroke="#d8dad1" stroke-width="3"/><rect x="80" y="1434" width="1040" height="150" rx="14" fill="#ffffff" stroke="#d8dad1" stroke-width="3"/><circle cx="150" cy="1509" r="36" fill="#fafaf7" stroke="#22231f" stroke-width="3"/><text x="150" y="1519" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#22231f" text-anchor="middle">8</text><text x="216" y="1491.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">Ask six questions before you</text><text x="216" y="1545.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#22231f" text-anchor="start">approve spend</text>
</svg>